name: Build NumWorks .nwa
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq make gcc-arm-none-eabi binutils-arm-none-eabi arm-none-eabi-newlib build-essential
    - run: cd /tmp && git clone --depth 1 https://github.com/numworks/epsilon.git
    - run: mkdir -p /tmp/epsilon/external_apps/rsa-crypto/src && cp src/app.cpp src/app.h src/controller.cpp src/controller.h Makefile /tmp/epsilon/external_apps/rsa-crypto/ 2>/dev/null; cp src/app.cpp src/app.h src/controller.cpp src/controller.h /tmp/epsilon/external_apps/rsa-crypto/src/ 2>/dev/null || true
    - run: cd /tmp/epsilon && make -C external_apps/rsa-crypto PLATFORM=device build
    - uses: actions/upload-artifact@v3
      with:
        name: rsa_crypto
        path: /tmp/epsilon/external_apps/rsa-crypto/output/device/rsa_crypto.nwa
